name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  # The sdist and the manylinux wheel with the Rust extension, built and checked as on every push
  # (dists.yml, also run by rust.yml).
  build:
    uses: ./.github/workflows/dists.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
